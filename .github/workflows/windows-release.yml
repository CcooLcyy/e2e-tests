name: Testbench Windows x64

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_stable:
        description: Publish the signed installer to MskDSPPlatform Stable
        type: boolean
        default: false
      release_notes:
        description: Release notes shown by the Stable updater
        type: string
        required: false

permissions:
  contents: read

env:
  RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'ci' || 'stable' }}

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Cache Rust test dependencies and build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: testbench-windows-x64-verify
          workspaces: src-tauri -> target
          cache-bin: 'false'
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Python self-tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install -r requirements.txt
          ./.venv/Scripts/python.exe -m pytest selftests -q
      - name: Frontend checks
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm test
          npm run build
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  build-installer:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 40
    environment: testbench-signing
    outputs:
      artifact-id: ${{ steps.installer.outputs.artifact-id }}
      offline-inputs-id: ${{ steps.offline-inputs.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust release dependencies and build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: testbench-windows-x64-release
          workspaces: src-tauri -> target
          cache-bin: 'false'
          save-if: ${{ github.event_name == 'push' }}
      - name: Stage installed runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          ./scripts/stage-windows-runtime.ps1
      - name: Configure the updater
        env:
          PLATFORM_GRPC_ENDPOINT: ${{ vars.PLATFORM_GRPC_ENDPOINT }}
          TESTBENCH_UPDATER_PUBLIC_KEY: ${{ vars.TESTBENCH_UPDATER_PUBLIC_KEY }}
          CASE_PACK_PUBLIC_KEY: ${{ vars.CASE_PACK_PUBLIC_KEY }}
        run: python scripts/windows_release.py configure $env:RELEASE_CHANNEL
      - name: Build and sign the platform NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TESTBENCH_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TESTBENCH_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing Testbench updater signing key' }
          $releaseConfig = Join-Path $env:RUNNER_TEMP 'testbench-tauri-release.json'
          npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --ci --config $releaseConfig -- --locked
      - name: Record installer identity
        run: python scripts/windows_release.py stage $env:RELEASE_CHANNEL
      - name: Retain the platform installer
        id: installer
        uses: actions/upload-artifact@v4
        with:
          name: testbench-windows-x64-nsis-${{ env.RELEASE_CHANNEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Archive offline installer inputs
        run: |
          $releaseConfig = Join-Path $env:RUNNER_TEMP 'testbench-tauri-release.json'
          Copy-Item -LiteralPath $releaseConfig -Destination 'src-tauri/.bundle/testbench-tauri-release.json'
          $paths = @(
            'src-tauri/.bundle/testbench-tauri-release.json'
            'src-tauri/.bundle/runtime'
            'src-tauri/target/x86_64-pc-windows-msvc/release/mskdsp-testbench.exe'
          )
          tar.exe -cf (Join-Path $env:RUNNER_TEMP 'testbench-offline-inputs.tar') @paths
      - name: Retain offline installer inputs
        id: offline-inputs
        uses: actions/upload-artifact@v4
        with:
          name: testbench-offline-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testbench-offline-inputs.tar
          if-no-files-found: error
          retention-days: 14

  build-offline-installer:
    needs: build-installer
    runs-on: windows-2025
    timeout-minutes: 20
    environment: testbench-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          targets: x86_64-pc-windows-msvc
      - name: Download offline installer inputs
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-installer.outputs.offline-inputs-id }}
          path: ${{ runner.temp }}
      - name: Restore offline installer inputs
        run: tar.exe -xf (Join-Path $env:RUNNER_TEMP 'testbench-offline-inputs.tar')
      - run: npm ci
      - name: Bundle and sign the offline NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TESTBENCH_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TESTBENCH_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing Testbench updater signing key' }
          $releaseConfig = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/.bundle/testbench-tauri-release.json'
          $offlineConfig = Join-Path $env:GITHUB_WORKSPACE 'src-tauri/tauri.offline.conf.json'
          npm run tauri -- bundle --target x86_64-pc-windows-msvc --bundles nsis --ci --no-binary-patching --config $releaseConfig --config $offlineConfig
      - name: Retain the offline installer
        uses: actions/upload-artifact@v4
        with:
          name: testbench-windows-x64-nsis-offline-${{ env.RELEASE_CHANNEL }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ github.event_name == 'push' && 'CI' || 'Stable' }}
    needs: build-installer
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.TESTBENCH_CI_PUBLISH_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_stable))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: ${{ github.event_name == 'push' && 'testbench-ci' || 'testbench-stable' }}
    concurrency:
      group: ${{ github.event_name == 'push' && 'testbench-platform-ci' || 'testbench-platform-stable' }}
      # Builds can finish out of order. Let the current-main guard decide which may publish.
      queue: max
    env:
      PLATFORM_GRPC_ENDPOINT: ${{ vars.PLATFORM_GRPC_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the pinned publication protocol
        uses: actions/checkout@v4
        with:
          repository: CcooLcyy/MskDSPPlatformProto
          ref: e86be3f7caf858937b38ddb52a71e63b23af4cf2
          path: platform-proto
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare gRPC bindings
        run: |
          python -m pip install 'grpcio==1.76.0' 'grpcio-tools==1.76.0'
          proto=platform-proto/platform/v1
          python -m grpc_tools.protoc -I "$proto" --python_out="$RUNNER_TEMP" --grpc_python_out="$RUNNER_TEMP" "$proto/software.proto"
      - name: Download the installer from this run
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-installer.outputs.artifact-id }}
          path: release/
      - name: Publish to MskDSPPlatform Stable
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTBENCH_PUBLISHER_TOKEN: ${{ secrets.TESTBENCH_PUBLISHER_TOKEN }}
          TESTBENCH_RELEASE_NOTES: ${{ inputs.release_notes }}
          PYTHONPATH: ${{ runner.temp }}
        run: python scripts/windows_release.py publish stable
      - name: Publish to MskDSPPlatform CI
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TESTBENCH_CI_PUBLISHER_TOKEN: ${{ secrets.TESTBENCH_CI_PUBLISHER_TOKEN }}
          PYTHONPATH: ${{ runner.temp }}
        run: python scripts/windows_release.py publish ci
