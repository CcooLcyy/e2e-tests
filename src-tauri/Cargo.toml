[package]
name = "mskdsp-testbench"
version = "0.1.0"
description = "测试上位机"
edition = "2021"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
http = "1"
minisign-verify = "0.2"
prost = "0.13"
semver = "1"
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "time"] }
tonic = { version = "0.13", default-features = false, features = ["channel", "prost"] }
